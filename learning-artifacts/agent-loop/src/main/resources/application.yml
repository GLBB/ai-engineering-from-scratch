server:
  address: 127.0.0.1
  port: ${AGENT_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  mvc:
    async:
      request-timeout: 1200000

# Do not let the harness-wide DEBUG environment enable request-body logging.
logging:
  level:
    org.springframework.web: INFO

agent:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  exa:
    api-key: ${EXA_AI_KEY:}
    fallback-api-key: ${EXA_API_KEY:}
  tracing:
    enabled: ${AGENT_TRACING_ENABLED:true}
    sample-ratio: ${AGENT_TRACE_SAMPLE_RATIO:1.0}
    release: ${AGENT_RELEASE:1.0-SNAPSHOT}
    langfuse:
      base-url: ${LANGFUSE_BASE_URL:http://127.0.0.1:3035}
      project-id: ${LANGFUSE_PROJECT_ID:}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
