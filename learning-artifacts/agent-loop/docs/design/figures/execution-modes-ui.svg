<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">ReAct、ReWOO 与 Plan-and-Execute 模式选择界面方案</title>
  <desc id="desc">三模式技术方案的界面附件。左侧在对话框上方设置独立模式栏，已开始的 ReWOO 对话原位显示只读模式，底部输入区只有模型、推理等级和发送。右侧为设置弹窗与新对话的三种模式选项。并非运行截图。</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #213044; }
      .title { font-size: 25px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 650; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .muted { fill: #64748b; }
      .blue { fill: #245cba; }
      .green { fill: #16734b; }
      .mono { font-family: ui-monospace, monospace; font-size: 15px; }
    </style>
  </defs>
  <rect width="1280" height="960" fill="#f2f5fa"/>
  <text x="40" y="46" class="title">三种执行模式的界面设计</text>
  <text x="40" y="75" class="body muted">设计示意 · 尚未实现 · 2026-11-01</text>

  <rect x="32" y="104" width="790" height="812" rx="18" fill="white" stroke="#d8e0eb"/>
  <rect x="32" y="104" width="790" height="62" rx="18" fill="#f9fbfe"/>
  <text x="56" y="144" class="heading">Agent Loop</text>
  <text x="690" y="144" class="small muted">本地运行</text>
  <line x1="32" y1="166" x2="822" y2="166" stroke="#e2e8f0"/>
  <rect x="53" y="181" width="78" height="36" rx="8" fill="#eaf1ff"/>
  <text x="76" y="205" class="body blue">对话</text>
  <text x="154" y="205" class="body muted">轨迹</text>
  <text x="710" y="205" class="small blue">新对话</text>

  <rect x="54" y="229" width="742" height="43" rx="9" fill="#f8fafc" stroke="#d8e0eb"/>
  <text x="70" y="256" class="body">执行模式</text>
  <rect x="164" y="235" width="155" height="30" rx="7" fill="#edf3ff"/>
  <text x="177" y="256" class="small blue">ReWOO · 已固定</text>
  <text x="337" y="256" class="small muted">新对话首次发送前可选，开始后只读展示</text>

  <g id="conversation-content" transform="translate(0,41)">
  <rect x="240" y="239" width="554" height="66" rx="12" fill="#edf3ff"/>
  <text x="258" y="267" class="body">请分两步计算 (120+18)/3，说明中间结果。</text>
  <text x="258" y="289" class="small muted">你</text>

  <text x="58" y="341" class="small blue">ReWOO · deepseek-flash · Off</text>
  <text x="58" y="373" class="body green">生成计划 ✓　校验计划 ✓　执行步骤 ✓　汇总回答 ✓</text>
  <rect x="56" y="393" width="739" height="203" rx="12" fill="#fafcff" stroke="#d7e1f0"/>
  <text x="75" y="424" class="heading">执行计划</text>
  <text x="688" y="423" class="small muted">2 / 2 完成</text>
  <line x1="75" y1="440" x2="775" y2="440" stroke="#e2e8f0"/>
  <text x="75" y="469" class="small muted">步骤</text>
  <text x="130" y="469" class="small muted">目的与工具</text>
  <text x="545" y="469" class="small muted">依赖</text>
  <text x="678" y="469" class="small muted">状态</text>
  <text x="75" y="506" class="mono">E1</text>
  <text x="130" y="504" class="body">计算括号内的和 · calculator</text>
  <text x="545" y="504" class="body muted">无</text>
  <text x="678" y="504" class="body green">已完成</text>
  <text x="130" y="527" class="mono muted">120+18 → 138</text>
  <text x="75" y="560" class="mono">E2</text>
  <text x="130" y="558" class="body">将上一步除以三 · calculator</text>
  <text x="545" y="558" class="body">E1</text>
  <text x="678" y="558" class="body green">已完成</text>
  <text x="130" y="581" class="mono muted">#E1/3 → 138/3 → 46</text>
  <text x="58" y="632" class="body">括号内的和是 138 [E1]，除以 3 的结果是 46 [E2]。</text>
  <text x="58" y="660" class="small muted">计划执行完成 · 模型请求 2 · 工具执行 2 · 答案待核验</text>
  </g>

  <rect x="54" y="715" width="742" height="145" rx="14" fill="white" stroke="#b8c8df"/>
  <text x="73" y="747" class="body muted">输入下一条消息…</text>
  <text x="72" y="784" class="small muted">模型</text>
  <text x="337" y="784" class="small muted">推理等级</text>
  <rect x="71" y="795" width="245" height="43" rx="8" fill="#f8fafc" stroke="#d8e0eb"/>
  <text x="85" y="823" class="body">DeepSeek V4.1 Flash</text>
  <rect x="335" y="795" width="154" height="43" rx="8" fill="#f8fafc" stroke="#d8e0eb"/>
  <text x="351" y="823" class="body">Off</text>
  <rect x="730" y="795" width="45" height="43" rx="10" fill="#245cba"/>
  <path d="M752 826 v-20 m-7 7 7 -7 7 7" fill="none" stroke="white" stroke-width="2"/>
  <text x="58" y="889" class="small muted">本对话的模式已固定。需要更改执行模式时，请新建对话。</text>

  <rect x="850" y="104" width="398" height="363" rx="18" fill="white" stroke="#d8e0eb"/>
  <text x="874" y="143" class="heading">设置弹窗</text>
  <text x="874" y="181" class="body">API 对接方式</text>
  <rect x="873" y="197" width="350" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="887" y="225" class="body">Chat Completions</text>
  <text x="874" y="272" class="small muted">API 对接方式保存后，重启应用生效。</text>
  <text x="874" y="310" class="body">执行模式在对话框上方选择与展示。</text>
  <text x="874" y="337" class="body">模型与推理等级可每轮调整。</text>
  <text x="874" y="365" class="small muted">开始对话后，当前模式只读展示。</text>
  <rect x="1098" y="402" width="124" height="41" rx="8" fill="#245cba"/>
  <text x="1125" y="429" class="body" style="fill:white">保存设置</text>

  <rect x="850" y="490" width="398" height="282" rx="18" fill="#edf3ff" stroke="#d5e3fa"/>
  <text x="874" y="527" class="heading">对话框上方：新对话可选</text>
  <text x="874" y="563" class="body blue">ReAct</text>
  <text x="874" y="587" class="body">根据每一步的结果决定下一步</text>
  <text x="874" y="618" class="body blue">ReWOO</text>
  <text x="874" y="642" class="body">先生成完整计划，执行取证后汇总</text>
  <text x="874" y="673" class="body blue">Plan-and-Execute</text>
  <text x="874" y="697" class="body">先拆解目标，逐步执行并调整计划</text>
  <text x="874" y="744" class="small muted">首条消息被接受后，模式固定。</text>

  <rect x="850" y="794" width="398" height="122" rx="18" fill="white" stroke="#d8e0eb"/>
  <text x="874" y="826" class="heading">计划与执行可追踪</text>
  <text x="874" y="853" class="body">ReWOO：查看静态步骤与证据。</text>
  <text x="874" y="880" class="body">P&amp;E：另显示计划版本与修订原因。</text>
  <text x="874" y="905" class="small muted">Bash 命令与输出仍分别确认。</text>
</svg>
